appId: 'shinobicraft2'
productName: 'ShinobiCraft2 Launcher'
artifactName: 'ShinobiCraft2.Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,tests,scripts,dev-app-update.yml,.nvmrc,eslint.config.mjs,DESIGN.md,premium-audit.json}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'build/icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: true
  perMachine: false

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

publish:
  provider: github
  owner: CaracatoP
  repo: ShinobiCraft2
